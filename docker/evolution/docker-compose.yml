# ============================================================================
# Evolution API v2 (atendimento WhatsApp/Instagram) - docker compose
#
# Sobe a Evolution API na porta 8080 com PostgreSQL proprio.
# Configuracao segredos em um arquivo .env neste mesmo diretorio:
#   cp .env.example .env  (preencha EVOLUTION_API_KEY e EVOLUTION_DB_PASSWORD)
#
# Comandos:
#   docker compose -f docker/evolution/docker-compose.yml --env-file docker/evolution/.env up -d
#   docker compose -f docker/evolution/docker-compose.yml --env-file docker/evolution/.env logs -f
#
# Webhook global aponta para o agente (localhost:3000/webhooks/whatsapp) via
# host.docker.internal (extra_hosts). Troque se o agente rodar em outro host.
# ============================================================================

name: loja-evolution

services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: loja-evolution-api
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_SAVE_MESSAGE_UPDATE_INSTANCE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE_CHAT: "true"
      DATABASE_SAVE_MESSAGE_UPDATE_CONTACT: "true"
      DATABASE_SAVE_DATA_CHAT_MESSAGES: "true"
      WEBHOOK_GLOBAL_URL: http://host.docker.internal:3000/webhooks/whatsapp
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_EVENTS: '["MESSAGES_UPSERT","QRCODE_UPDATED","CONNECTION_UPDATE"]'
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "true"
      WEBHOOK_GLOBAL_WEBHOOK_INTERNAL_LOG: "false"
      WEBHOOK_GLOBAL_WEBHOOK_ENABLE_INSTANCE_LOG: "false"
      LOG_LEVEL: ERROR
      DEL_INSTANCE: "false"
      RABBITMQ_ENABLED: "false"
      CACHE_REDIS_ENABLED: "false"
      SQS_ENABLED: "false"

  evolution-postgres:
    image: postgres:16-alpine
    container_name: loja-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evolution-postgres-data:
